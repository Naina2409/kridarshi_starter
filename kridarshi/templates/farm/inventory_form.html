{% extends "base.html" %}
{% block content %}
<h4>{{ T.add_inventory }}</h4>
<form method="post" class="bg-white p-4 rounded shadow-sm" style="max-width:480px">
  {% csrf_token %}
  <div class="mb-3"><label class="form-label">{{ T.name }}</label><input class="form-control" name="name" required></div>
  <div class="mb-3">
    <label class="form-label">{{ T.category }}</label>
    <select class="form-select" name="category">
      <option value="seed">{{ T.cat_seed }}</option>
      <option value="fertilizer">{{ T.cat_fertilizer }}</option>
      <option value="tool">{{ T.cat_tool }}</option>
      <option value="produce">{{ T.cat_produce }}</option>
    </select>
  </div>
  <div class="mb-3"><label class="form-label">{{ T.quantity }}</label><input type="number" step="0.1" class="form-control" name="quantity" required></div>
  <div class="mb-3"><label class="form-label">{{ T.unit }}</label><input class="form-control" name="unit" value="kg"></div>
  <div class="mb-3"><label class="form-label">{{ T.low_stock_threshold }}</label><input type="number" step="0.1" class="form-control" name="low_stock_threshold" value="5"></div>
  <div class="mb-3"><label class="form-label">{{ T.expiry_optional }}</label><input type="date" class="form-control" name="expiry_date"></div>
  <button class="btn btn-success">{{ T.save }}</button>
</form>
{% endblock %}
