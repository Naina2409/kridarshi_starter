{% extends "base.html" %}
{% block content %}
<h4>{{ T.ask_title }}</h4>
<form method="post" id="ask-form" class="d-flex flex-wrap gap-2 mb-3" style="max-width:720px">
  {% csrf_token %}
  <input class="form-control" id="question-input" name="question" placeholder="{{ T.ask_placeholder }}" value="{{ question }}" style="min-width:240px; flex:1" autocomplete="off">
  <button type="button" class="btn btn-outline-success" id="mic-btn">{{ T.record }}</button>
  <button class="btn btn-success">{{ T.ask }}</button>
</form>
{% if answer %}
<div class="alert alert-info d-flex justify-content-between align-items-start gap-3">
  <div id="answer-text">{{ answer }}</div>
  <button type="button" class="btn btn-sm btn-success" id="listen-answer">{{ T.listen }}</button>
</div>
{{ answer|json_script:"answer-json" }}
{% endif %}
{% endblock %}
{% block extra_js %}
<script>
  const micBtn = document.getElementById("mic-btn");
  const form = document.getElementById("ask-form");
  const input = document.getElementById("question-input");
  const listenBtn = document.getElementById("listen-answer");
  const speechLang = { en: "en-IN", hi: "hi-IN", pa: "pa-IN" }[window.KRIDARSHI.lang] || "en-IN";
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (listenBtn) {
    listenBtn.addEventListener("click", () => {
      window.kridarshiSpeak(JSON.parse(document.getElementById("answer-json").textContent));
    });
  }

  let recorder = null;
  let chunks = [];
  let recognition = null;
  let liveText = "";

  function showInChatBar(text) {
    if (!text) return;
    liveText = text.trim();
    input.value = liveText;
    input.dispatchEvent(new Event("input", { bubbles: true }));
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }

  function startLiveTranscript() {
    liveText = "";
    if (!SpeechRecognition) return;
    recognition = new SpeechRecognition();
    recognition.lang = speechLang;
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onresult = (event) => {
      let text = "";
      for (let i = 0; i < event.results.length; i++) {
        text += event.results[i][0].transcript;
        if (i < event.results.length - 1) text += " ";
      }
      showInChatBar(text.replace(/\s+/g, " "));
    };
    try { recognition.start(); } catch (err) { /* already started */ }
  }

  function stopLiveTranscript() {
    if (!recognition) return;
    try { recognition.stop(); } catch (err) { /* already stopped */ }
    recognition = null;
  }

  micBtn.addEventListener("click", async () => {
    if (!window.KRIDARSHI.voiceEnabled) {
      alert(window.KRIDARSHI.missing);
      return;
    }
    if (recorder && recorder.state === "recording") {
      recorder.stop();
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunks = [];
      input.value = "";
      startLiveTranscript();
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        stopLiveTranscript();
        micBtn.textContent = window.KRIDARSHI.record;
        const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
        let spoken = liveText;
        try {
          const data = new FormData();
          data.append("audio", blob, "question.webm");
          const res = await fetch(window.KRIDARSHI.transcribeUrl, {
            method: "POST",
            headers: { "X-CSRFToken": window.KRIDARSHI.csrf },
            body: data,
          });
          if (res.ok) {
            const payload = await res.json();
            if (payload.text) spoken = payload.text;
          }
        } catch (err) {
          /* keep live transcript */
        }
        if (!spoken) {
          alert(window.KRIDARSHI.transcribeError);
          return;
        }
        showInChatBar(spoken);
      };
      recorder.start(250);
      micBtn.textContent = window.KRIDARSHI.recording;
      input.focus();
    } catch (err) {
      alert(window.KRIDARSHI.micError);
    }
  });
</script>
{% endblock %}
